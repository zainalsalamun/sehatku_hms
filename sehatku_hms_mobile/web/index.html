<body>
  <script>
    // SehatKu HMS - Clinic Queue Chime & Voice Announcer Engine
    let cachedVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // High-Fidelity Crystal Chime Synthesizer (Ascending C-Major 4-Tone Arpeggio)
    function playHarmonicBell(ctx, freq, startTime, duration, masterGain) {
      const now = startTime;

      // 1. Fundamental tone (Sine)
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, now);

      gain1.gain.setValueAtTime(0.001, now);
      gain1.gain.linearRampToValueAtTime(masterGain, now + 0.015);
      gain1.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + duration);

      // 2. Harmonic overtone (2nd octave / chime brilliance)
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, now);

      gain2.gain.setValueAtTime(0.001, now);
      gain2.gain.linearRampToValueAtTime(masterGain * 0.25, now + 0.01);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + (duration * 0.6));

      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + (duration * 0.6));
    }

    window.playHospitalChimeAndSpeak = function(spokenText) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const ctx = new AudioContext();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          const t0 = ctx.currentTime + 0.05;

          // 4-Tone Uplifting Hospital Chime (C5 -> E5 -> G5 -> C6)
          playHarmonicBell(ctx, 523.25, t0 + 0.00, 0.38, 0.28); // C5
          playHarmonicBell(ctx, 659.25, t0 + 0.18, 0.38, 0.30); // E5
          playHarmonicBell(ctx, 783.99, t0 + 0.36, 0.42, 0.32); // G5
          playHarmonicBell(ctx, 1046.50, t0 + 0.54, 0.90, 0.35); // C6 (High crystal chime)
        }
      } catch (e) {
        console.warn('AudioContext error:', e);
      }

      // Voice TTS Announcement after pleasant chime
      setTimeout(function() {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Clear any previous speech
            const utterance = new SpeechSynthesisUtterance(spokenText);
            utterance.lang = 'id-ID';
            utterance.rate = 0.96; // Lively, clear, articulate cadence
            utterance.pitch = 1.08; // Bright, friendly, attentive, professional pitch
            utterance.volume = 1.0;

            const voices = cachedVoices.length > 0 ? cachedVoices : window.speechSynthesis.getVoices();
            
            // Prioritize best natural/neural Indonesian voice
            const indonesianVoices = voices.filter(v => 
              (v.lang && (v.lang.startsWith('id') || v.lang.startsWith('ID'))) || 
              (v.name && v.name.toLowerCase().includes('indonesia'))
            );

            let selectedVoice = null;
            if (indonesianVoices.length > 0) {
              // Prefer natural/neural/Google/Microsoft voices if available
              selectedVoice = indonesianVoices.find(v => 
                v.name.toLowerCase().includes('natural') || 
                v.name.toLowerCase().includes('online') ||
                v.name.toLowerCase().includes('google') ||
                v.name.toLowerCase().includes('gadis') ||
                v.name.toLowerCase().includes('damayanti') ||
                v.name.toLowerCase().includes('ardi')
              ) || indonesianVoices[0];
            }

            if (selectedVoice) {
              utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
          }
        } catch (e) {
          console.warn('SpeechSynthesis error:', e);
        }
      }, 1450);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
